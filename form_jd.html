<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JD Generator — HR Autopilot</title>
<style>
  :root {
    --bg: #0F1629;
    --card: #1A2240;
    --card2: #212A4D;
    --accent: #4C7CF0;
    --accent2: #3DD9A8;
    --white: #FFFFFF;
    --ice: #C9D6F2;
    --slate: #8A93B8;
    --border: #2A3560;
    --error: #E0556B;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--white);
    min-height: 100vh; padding: 40px 20px;
  }

  .container { max-width: 720px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 40px; }
  .header-logo { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
  .header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 8px; }
  .header p { font-size: 15px; color: var(--slate); }

  .lang-toggle { display: flex; justify-content: center; gap: 0; margin-bottom: 32px; }
  .lang-btn { padding: 8px 24px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--card2); color: var(--slate); transition: all .15s; }
  .lang-btn:first-child { border-radius: 8px 0 0 8px; }
  .lang-btn:last-child { border-radius: 0 8px 8px 0; border-left: none; }
  .lang-btn.active { background: var(--accent); color: var(--white); border-color: var(--accent); }

  .card { background: var(--card); border-radius: 16px; padding: 32px; margin-bottom: 16px; }
  .card-title { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }

  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ice); margin-bottom: 7px; }
  label .req { color: var(--accent); }
  label .hint { font-weight: 400; color: var(--slate); font-size: 12px; margin-left: 6px; }

  input, textarea, select {
    width: 100%; background: var(--card2); border: 1px solid var(--border);
    color: var(--white); font-family: inherit; font-size: 14px;
    padding: 12px 16px; border-radius: 10px; outline: none;
    transition: border-color .15s; resize: vertical;
  }
  input::placeholder, textarea::placeholder { color: var(--slate); }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--card2); }
  textarea { min-height: 100px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .submit-btn {
    width: 100%; background: var(--accent); color: var(--white);
    border: none; padding: 16px; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: opacity .15s; margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .submit-btn:hover { opacity: .85; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Result */
  .result { display: none; background: var(--card); border-radius: 16px; padding: 32px; margin-top: 24px; }
  .result.show { display: block; }
  .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .result-title { font-size: 18px; font-weight: 700; }
  .result-actions { display: flex; gap: 10px; }
  .btn-copy, .btn-new {
    padding: 9px 18px; border-radius: 9px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; transition: opacity .15s;
  }
  .btn-copy { background: var(--accent2); color: var(--bg); }
  .btn-new { background: var(--card2); color: var(--ice); border: 1px solid var(--border); }
  .btn-copy:hover, .btn-new:hover { opacity: .8; }
  .result-text {
    background: var(--card2); border-radius: 10px; padding: 20px;
    font-size: 14px; line-height: 1.8; color: var(--ice);
    white-space: pre-wrap; max-height: 600px; overflow-y: auto;
  }
  .result-note { font-size: 12px; color: var(--slate); margin-top: 12px; }

  /* Status */
  .status { text-align: center; padding: 20px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text { font-size: 14px; color: var(--slate); }
  .error-msg { color: var(--error); font-size: 14px; text-align: center; padding: 12px; background: rgba(224,85,107,.1); border-radius: 8px; margin-top: 12px; }

  @media (max-width: 600px) {
    .grid-2 { grid-template-columns: 1fr; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="header-logo">HR Autopilot</div>
    <h1 data-ru="JD-генератор" data-en="JD Generator">JD-генератор</h1>
    <p data-ru="Заполни форму — Claude напишет текст вакансии за 30 секунд" data-en="Fill in the form — Claude will write the job description in 30 seconds">Заполни форму — Claude напишет текст вакансии за 30 секунд</p>
  </div>

  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('ru')" data-ru="🇷🇺 Вакансия на русском" data-en="🇷🇺 Job description in Russian">🇷🇺 Вакансия на русском</button>
    <button class="lang-btn" onclick="setLang('en')" data-ru="🇬🇧 Job description in English" data-en="🇬🇧 Job description in English">🇬🇧 Job description in English</button>
  </div>

  <form id="jdForm">

    <div class="card">
      <div class="card-title" data-ru="О роли" data-en="About the role">О роли</div>

      <div class="grid-2">
        <div class="field">
          <label><span data-ru="Название роли" data-en="Role title">Название роли</span> <span class="req">*</span></label>
          <input type="text" id="role" placeholder="Product Manager" required>
        </div>
        <div class="field">
          <label><span data-ru="Команда / отдел" data-en="Team / department">Команда / отдел</span></label>
          <input type="text" id="team" placeholder="Product">
        </div>
      </div>

      <div class="field">
        <label>
          <span data-ru="Ключевые задачи" data-en="Key responsibilities">Ключевые задачи</span> <span class="req">*</span>
          <span class="hint" data-ru="(3-5 пунктов)" data-en="(3-5 items)">(3-5 пунктов)</span>
        </label>
        <textarea id="tasks" placeholder="— Управление продуктовым роадмапом&#10;— Работа с командой разработки (5 человек)&#10;— Анализ метрик и user research&#10;— Запуск фич от идеи до релиза" required></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-ru="Требования" data-en="Requirements">Требования</div>

      <div class="field">
        <label>
          <span data-ru="Опыт и навыки" data-en="Experience and skills">Опыт и навыки</span> <span class="req">*</span>
          <span class="hint" data-ru="(что реально важно)" data-en="(what really matters)">(что реально важно)</span>
        </label>
        <textarea id="requirements" placeholder="— 3+ лет опыта в продукте&#10;— Опыт запуска B2C продуктов&#10;— Английский Upper-Intermediate+&#10;— Умение работать с данными (SQL плюс)" required></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-ru="Условия" data-en="Conditions">Условия</div>

      <div class="grid-2">
        <div class="field">
          <label><span data-ru="Формат работы" data-en="Work format">Формат работы</span></label>
          <select id="format">
            <option value="" data-ru="Выбери формат" data-en="Select format">Выбери формат</option>
            <option value="Удалённо" data-ru="Удалённо" data-en="Remote">Удалённо</option>
            <option value="Офис" data-ru="Офис" data-en="On-site">Офис</option>
            <option value="Гибрид" data-ru="Гибрид" data-en="Hybrid">Гибрид</option>
          </select>
        </div>
        <div class="field">
          <label><span data-ru="Локация" data-en="Location">Локация</span></label>
          <input type="text" id="location" placeholder="Кипр / Worldwide">
        </div>
      </div>

      <div class="field">
        <label>
          <span data-ru="Зарплатная вилка" data-en="Salary range">Зарплатная вилка</span>
          <span class="hint" data-ru="(необязательно)" data-en="(optional)">(необязательно)</span>
        </label>
        <input type="text" id="salary" placeholder="$3 000 – $5 000 / мес">
      </div>

      <div class="field">
        <label>
          <span data-ru="Кто запрашивает" data-en="Requested by">Кто запрашивает</span>
          <span class="hint" data-ru="(имя нанимающего менеджера)" data-en="(hiring manager name)">(имя нанимающего менеджера)</span>
        </label>
        <input type="text" id="requester" placeholder="Иван Петров">
      </div>

      <div class="field">
        <label>
          <span data-ru="Slack ID лидов" data-en="Lead Slack IDs">Slack ID лидов</span>
          <span class="hint" data-ru="(через запятую — добавятся в канал #hiring)" data-en="(comma-separated — will be added to #hiring channel)">(через запятую — добавятся в #hiring канал)</span>
        </label>
        <input type="text" id="leadSlackIds" placeholder="U0BDR15SM09, U0BDR15SM10">
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      <span id="submitIcon">✨</span>
      <span id="submitText" data-ru="Сгенерировать JD" data-en="Generate JD">Сгенерировать JD</span>
    </button>

  </form>

  <!-- Статус загрузки -->
  <div class="status" id="statusBlock" style="display:none;">
    <div class="spinner"></div>
    <div class="status-text" id="statusText" data-ru="Claude пишет текст вакансии..." data-en="Claude is writing the job description...">Claude пишет текст вакансии...</div>
  </div>

  <!-- Ошибка -->
  <div class="error-msg" id="errorMsg" style="display:none;"></div>

  <!-- Результат -->
  <div class="result" id="resultBlock">
    <div class="result-header">
      <div class="result-title" id="resultTitle">📋 Product Manager</div>
      <div class="result-actions">
        <button class="btn-copy" onclick="copyJD()" data-ru="Скопировать" data-en="Copy">Скопировать</button>
        <button class="btn-new" onclick="resetForm()" data-ru="Новый JD" data-en="New JD">Новый JD</button>
      </div>
    </div>
    <div class="result-text" id="resultText"></div>
    <div class="result-note" data-ru="✅ JD сохранён в Google Таблицу (лист JobDescriptions) и отправлен HR в Slack" data-en="✅ JD saved to Google Sheets (JobDescriptions) and sent to HR in Slack">✅ JD сохранён в Google Таблицу (лист JobDescriptions) и отправлен HR в Slack</div>
  </div>

</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyyUd8_AkNGo6jUEs4GnfVYxeOaRhtYmVHVo4rqQ5tAxtyHSQOCPzkVFxytJVKNgUcJ/exec';

let currentLang = 'ru';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && lang === 'ru') || (i === 1 && lang === 'en'));
  });
  document.querySelectorAll('[data-' + lang + ']').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if (el.tagName === 'OPTION') el.textContent = val;
    else el.textContent = val;
  });
  // Обновляем плейсхолдеры для select options
  document.querySelectorAll('select option').forEach(opt => {
    const val = opt.getAttribute('data-' + lang);
    if (val) opt.textContent = val;
  });
}

document.getElementById('jdForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const role = document.getElementById('role').value.trim();
  const team = document.getElementById('team').value.trim();
  const tasks = document.getElementById('tasks').value.trim();
  const requirements = document.getElementById('requirements').value.trim();
  const format = document.getElementById('format').value;
  const location = document.getElementById('location').value.trim();
  const salary = document.getElementById('salary').value.trim();
  const requester    = document.getElementById('requester').value.trim();
  const leadSlackIds = document.getElementById('leadSlackIds').value
    .split(',').map(s => s.trim()).filter(Boolean);

  // Показываем загрузку
  document.getElementById('jdForm').style.display = 'none';
  document.getElementById('statusBlock').style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('resultBlock').classList.remove('show');

  try {
    const response = await fetch(WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'generate_jd',
        role, team, tasks, requirements, format, location, salary, requester, leadSlackIds,
        lang: currentLang
      })
    });

    const data = await response.json();

    document.getElementById('statusBlock').style.display = 'none';

    if (data.error) {
      document.getElementById('errorMsg').textContent = 'Ошибка: ' + data.error;
      document.getElementById('errorMsg').style.display = 'block';
      document.getElementById('jdForm').style.display = 'block';
      return;
    }

    // Показываем результат
    document.getElementById('resultTitle').textContent = '📋 ' + role;
    document.getElementById('resultText').textContent = data.jd;
    document.getElementById('resultBlock').classList.add('show');

  } catch(err) {
    document.getElementById('statusBlock').style.display = 'none';
    document.getElementById('errorMsg').textContent = 'Ошибка соединения: ' + err.message;
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('jdForm').style.display = 'block';
  }
});

function copyJD() {
  const text = document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ Скопировано!';
    setTimeout(() => { btn.textContent = currentLang === 'ru' ? 'Скопировать' : 'Copy'; }, 2000);
  });
}

function resetForm() {
  document.getElementById('resultBlock').classList.remove('show');
  document.getElementById('jdForm').style.display = 'block';
  document.getElementById('jdForm').reset();
}
</script>
</body>
</html>
