<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кандидаты — HR Autopilot</title>
<style>
:root {
  --bg:#0B0F1E; --panel:#141929; --panel2:#1A2140;
  --accent:#5B8AF0; --accent2:#3DD9A8;
  --text:#E8EBF5; --dim:#A0AABF; --faint:#6B7490;
  --line:#252D47; --gold:#F5C842; --err:#E0556B; --purple:#A855F7;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* LOGIN */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:var(--panel);border-radius:16px;padding:40px;width:100%;max-width:360px;text-align:center;}
.login-logo{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;}
.login-title{font-size:22px;font-weight:800;margin-bottom:24px;}
.login-input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:15px;padding:12px 16px;border-radius:10px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:4px;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
.login-err{color:var(--err);font-size:13px;margin-top:10px;display:none;}

/* MAIN */
#mainWrap{display:none;max-width:1000px;margin:0 auto;padding:32px 20px;}

/* HEADER */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.pt{font-size:24px;font-weight:800;}
.pt span{color:var(--accent);}
.hr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
select{background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:13px;padding:9px 14px;border-radius:9px;outline:none;}
select:focus{border-color:var(--accent);}

/* STATS */
.stats{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.stat{background:var(--panel);border-radius:12px;padding:16px 20px;flex:1;min-width:100px;}
.snum{font-size:28px;font-weight:800;color:var(--accent);line-height:1;}
.slbl{font-size:12px;color:var(--faint);margin-top:4px;}

/* CARDS */
.card{background:var(--panel);border-radius:12px;padding:20px;margin-bottom:12px;border-left:4px solid var(--line);}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.cname{font-size:16px;font-weight:700;}
.cmeta{font-size:12px;color:var(--faint);margin-top:3px;}
.cr{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sbadge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;}
.s-new{background:#F3F4F6;color:#6B7280;}
.s-cv_scoring{background:#EFF6FF;color:#1D4ED8;}
.s-elayn{background:#F0FDF4;color:#15803D;}
.s-technical{background:#FEF3C7;color:#B45309;}
.s-hold{background:#FDF4FF;color:#7E22CE;}
.s-offer{background:#ECFDF5;color:#065F46;}
.s-hired{background:#D1FAE5;color:#064E3B;}
.s-rejected{background:#FEE2E2;color:#991B1B;}
.scbadge{font-size:16px;font-weight:800;padding:5px 12px;border-radius:8px;}
.sc-hi{background:rgba(61,217,168,.12);color:#3DD9A8;}
.sc-mi{background:rgba(245,200,66,.12);color:#C9950A;}
.sc-lo{background:rgba(224,85,107,.12);color:#E0556B;}
.vbadge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;}
.v-hi{background:rgba(61,217,168,.12);color:#3DD9A8;}
.v-mi{background:rgba(245,200,66,.12);color:#C9950A;}
.v-lo{background:rgba(224,85,107,.12);color:#E0556B;}

.cbody{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
.ftitle{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.fitem{font-size:13px;color:var(--dim);margin-bottom:4px;display:flex;gap:6px;}
.fdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.fdot.g{background:var(--accent2);}
.fdot.r{background:var(--err);}
.summary{font-size:13px;color:var(--dim);font-style:italic;line-height:1.6;padding:12px;background:var(--panel2);border-radius:8px;margin-bottom:12px;}

/* STATUS BUTTONS */
.sbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.sbtn{padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--faint);transition:all .15s;}
.sbtn:hover{border-color:var(--accent);color:var(--accent);}
.sbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.sbtn.danger{border-color:var(--err);color:var(--err);}
.sbtn.danger:hover{background:var(--err);color:#fff;}
.sbtn.success{border-color:var(--accent2);color:var(--accent2);}
.sbtn.success:hover{background:var(--accent2);color:var(--bg);}

/* ACTION BUTTONS */
.acts{display:flex;gap:8px;flex-wrap:wrap;}
.abtn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--dim);text-decoration:none;display:inline-block;transition:all .15s;}
.abtn:hover{border-color:var(--accent);color:var(--accent);}
.abtn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.abtn.primary:hover{opacity:.85;}
.abtn.success{border-color:var(--accent2);color:var(--accent2);}
.abtn.success:hover{background:var(--accent2);color:var(--bg);}

/* MODAL */
.moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:20px;}
.moverlay.open{display:flex;}
.mbox{background:var(--panel);border-radius:16px;padding:28px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;}
.mtitle{font-size:18px;font-weight:800;margin-bottom:16px;}
.mclose{float:right;cursor:pointer;font-size:20px;color:var(--faint);background:none;border:none;margin-top:-4px;}
.minput{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:14px;padding:10px 14px;border-radius:9px;outline:none;margin-bottom:12px;}
.minput:focus{border-color:var(--accent);}
.mlabel{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:6px;display:block;}
.mactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.offer-text{background:var(--panel2);border-radius:10px;padding:16px;font-size:13px;line-height:1.8;color:var(--text);white-space:pre-wrap;margin-bottom:12px;min-height:160px;}
.mstatus{font-size:13px;color:var(--accent2);margin-top:10px;}
.mhint{font-size:12px;color:var(--faint);margin-top:8px;}

.empty{text-align:center;padding:60px;color:var(--faint);}
.loading{text-align:center;padding:40px;color:var(--faint);}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:600px){.cbody{grid-template-columns:1fr;}.stats{flex-direction:column;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-box">
    <div class="login-logo">HR Autopilot</div>
    <div class="login-title">👥 Кандидаты</div>
    <input type="password" class="login-input" id="pwdInput" placeholder="••••••••" autocomplete="new-password">
    <button class="login-btn" onclick="login()">Войти</button>
    <div class="login-err" id="loginErr">Неверный пароль</div>
  </div>
</div>

<!-- MODAL: OFFER -->
<div class="moverlay" id="mOffer">
  <div class="mbox">
    <button class="mclose" onclick="closeModal('mOffer')">✕</button>
    <div class="mtitle" id="mOfferTitle">📄 Оффер</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
      <div><label class="mlabel">Зарплата</label><input type="text" class="minput" id="mOfferSalary" placeholder="$3 000 / мес" style="margin-bottom:0"></div>
      <div><label class="mlabel">Дата выхода</label><input type="text" class="minput" id="mOfferStart" placeholder="01.08.2026" style="margin-bottom:0"></div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:12px;">
      <button class="abtn primary" onclick="genOffer()">✨ Сгенерировать</button>
      <select id="mOfferLang" style="background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;outline:none;">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>
    <div id="mOfferLoading" style="display:none;text-align:center;padding:16px;color:var(--faint);">Генерируем...</div>
    <div class="offer-text" id="mOfferText" style="display:none;"></div>
    <div class="mactions" id="mOfferActions" style="display:none;">
      <button class="abtn" onclick="copyText('mOfferText')">📋 Скопировать</button>
      <button class="abtn success" onclick="confirmOffer()">✅ Оффер отправлен</button>
      <button class="abtn" onclick="closeModal('mOffer')">Закрыть</button>
    </div>
  </div>
</div>

<!-- MODAL: DOCS -->
<div class="moverlay" id="mDocs">
  <div class="mbox">
    <button class="mclose" onclick="closeModal('mDocs')">✕</button>
    <div class="mtitle" id="mDocsTitle">📎 Документы</div>
    <label class="mlabel">Дата старта *</label>
    <input type="text" class="minput" id="mDocsStart" placeholder="01.08.2026">
    <div style="display:flex;gap:10px;margin-bottom:12px;">
      <button class="abtn primary" onclick="genDocs()">✨ Сгенерировать письмо</button>
      <select id="mDocsLang" style="background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;outline:none;">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>
    <div id="mDocsLoading" style="display:none;text-align:center;padding:16px;color:var(--faint);">Генерируем...</div>
    <div id="mDocsPreview" style="display:none;">
      <label class="mlabel">Тема</label>
      <input type="text" class="minput" id="mDocsSubj">
      <label class="mlabel">Текст</label>
      <textarea id="mDocsBody" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13px;padding:12px;border-radius:9px;outline:none;min-height:240px;line-height:1.7;resize:vertical;margin-bottom:12px;"></textarea>
      <div class="mactions">
        <button class="abtn primary" onclick="openMail()">📧 Открыть в почте</button>
        <button class="abtn" onclick="copyDocs()">📋 Скопировать</button>
        <button class="abtn" onclick="closeModal('mDocs')">Закрыть</button>
      </div>
      <div class="mhint">💡 Прикрепи NDA и контракт вручную перед отправкой</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="mainWrap">
  <div class="ph">
    <div class="pt">👥 <span>Кандидаты</span></div>
    <div class="hr">
      <select id="fVacancy" onchange="filter()"><option value="">Все вакансии</option></select>
      <select id="fVerdict" onchange="filter()">
        <option value="">Все вердикты</option>
        <option value="Приглашаем">✅ Приглашаем</option>
        <option value="Требует">⚠️ Доп. оценка</option>
        <option value="Не соответствует">❌ Не подходит</option>
      </select>
      <button class="abtn" onclick="reload()">↻ Обновить</button>
    </div>
  </div>
  <div class="stats" id="statsRow"></div>
  <div id="list"><div class="loading"><div class="spinner"></div>Загружаем...</div></div>
</div>

<script>
const URL = 'https://script.google.com/macros/s/AKfycbyyUd8_AkNGo6jUEs4GnfVYxeOaRhtYmVHVo4rqQ5tAxtyHSQOCPzkVFxytJVKNgUcJ/exec';
const PWD = 'natalyk2026';

const SL = {new:'Новый',cv_scoring:'CV скоринг',elayn:'Элайн',technical:'Техническое',hold:'Hold',offer:'Оффер',hired:'✅ Принят',rejected:'❌ Отказ'};
const SO = ['new','cv_scoring','elayn','technical','hold','offer','hired','rejected'];

let all = [], cur = null;

function login() {
  const v = document.getElementById('pwdInput').value;
  if (v === PWD) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    reload();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}
document.getElementById('pwdInput').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
// Очищаем поле при загрузке — защита от автозаполнения браузера
window.addEventListener('load', () => { document.getElementById('pwdInput').value = ''; });

async function reload() {
  document.getElementById('list').innerHTML = '<div class="loading"><div class="spinner"></div>Загружаем...</div>';
  try {
    const r = await fetch(URL + '?type=candidates');
    const d = await r.json();
    all = d.candidates || [];
    buildFilters();
    filter();
  } catch(e) {
    document.getElementById('list').innerHTML = '<div class="empty">Ошибка: ' + e.message + '</div>';
  }
}

function buildFilters() {
  const vacs = [...new Set(all.map(c=>c.vacancy).filter(Boolean))].sort();
  const sel = document.getElementById('fVacancy');
  sel.innerHTML = '<option value="">Все вакансии (' + all.length + ')</option>';
  vacs.forEach(v => {
    const n = all.filter(c=>c.vacancy===v).length;
    sel.innerHTML += '<option value="'+v+'">'+v+' ('+n+')</option>';
  });
}

function filter() {
  const fv = document.getElementById('fVacancy').value;
  const fd = document.getElementById('fVerdict').value;
  let list = all;
  if (fv) list = list.filter(c=>c.vacancy===fv);
  if (fd) list = list.filter(c=>(c.verdict||'').includes(fd));
  render(list);
}

function sc(s) { return s>=70?'sc-hi':s>=50?'sc-mi':'sc-lo'; }
function se(s) { return s>=70?'🟢':s>=50?'🟡':'🔴'; }
function vc(v) { return (v||'').includes('Приглашаем')?'v-hi':(v||'').includes('Требует')?'v-mi':'v-lo'; }
function vs(v) { return (v||'—').replace('Приглашаем на интервью','✅ Приглашаем').replace('Приглашаем на следующий этап','✅ Приглашаем').replace('Требует дополнительной оценки','⚠️ Доп. оценка').replace('Не соответствует','❌ Не подходит'); }

function render(list) {
  const stats = document.getElementById('statsRow');
  const el = document.getElementById('list');

  if (!list.length) { stats.innerHTML=''; el.innerHTML='<div class="empty">Кандидатов нет</div>'; return; }

  const total = list.length;
  const inv = list.filter(c=>(c.verdict||'').includes('Приглашаем')).length;
  const hold = list.filter(c=>(c.status||'')==='hold').length;
  const avg = Math.round(list.reduce((s,c)=>s+(parseFloat(c.score)||0),0)/total);

  stats.innerHTML = [['Всего',total,''],['Приглашаем',inv,'color:#3DD9A8'],['Hold',hold,'color:#A855F7'],['Ср. балл',avg,'']].map(([l,n,st])=>
    '<div class="stat"><div class="snum" style="'+st+'">'+n+'</div><div class="slbl">'+l+'</div></div>'
  ).join('');

  el.innerHTML = list.map(function(c, idx) {
    const score = parseFloat(c.score)||0;
    const status = c.status || 'cv_scoring';
    const greens = (c.green||'').split(';').filter(Boolean).slice(0,3);
    const reds   = (c.red||'').split(';').filter(Boolean).slice(0,2);

    const ghtml = greens.map(f=>'<div class="fitem"><div class="fdot g"></div>'+f.trim()+'</div>').join('');
    const rhtml = reds.map(f=>'<div class="fitem"><div class="fdot r"></div>'+f.trim()+'</div>').join('');
    const fbody = (greens.length||reds.length) ? '<div class="cbody">'+(greens.length?'<div><div class="ftitle">Сильные стороны</div>'+ghtml+'</div>':'')+  (reds.length?'<div><div class="ftitle">Зоны риска</div>'+rhtml+'</div>':'')+'</div>' : '';

    const sbtns = SO.map(s => {
      let cls = 'sbtn';
      if (s==='rejected') cls+=' danger';
      else if (s==='hired') cls+=' success';
      if (s===status) cls+=' active';
      return '<button class="'+cls+'" onclick="chStatus('+idx+',\''+s+'\',this)">'+SL[s]+'</button>';
    }).join('');

    const i = JSON.stringify(idx);
    return '<div class="card" id="card-'+idx+'">' +
      '<div class="ch"><div><div class="cname">'+(c.name||'—')+'</div><div class="cmeta">'+(c.vacancy||'')+' · '+(c.email||'')+' · '+(c.date||'')+'</div></div>' +
      '<div class="cr"><span class="sbadge s-'+status+'" id="sb-'+idx+'">'+SL[status]+'</span><span class="scbadge '+sc(score)+'">'+se(score)+' '+score+'</span><span class="vbadge '+vc(c.verdict)+'">'+vs(c.verdict)+'</span></div></div>' +
      fbody +
      (c.summary?'<div class="summary">'+c.summary+'</div>':'') +
      '<div class="sbtns">'+sbtns+'</div>' +
      '<div class="acts">' +
        (c.email?'<a href="mailto:'+c.email+'" class="abtn" id="btn-mail-'+idx+'" onclick="markDone(\'btn-mail-'+idx+'\',\'primary\')">✉️ Написать</a>':'')+
        (c.pdfUrl?'<a href="'+c.pdfUrl+'" target="_blank" class="abtn">📄 Резюме</a>':'')+
        (c.threadUrl?'<a href="'+c.threadUrl+'" target="_blank" class="abtn">💬 Тред</a>':'')+
        '<button class="abtn" id="btn-offer-'+idx+'" onclick="openOffer('+i+')">📄 Оффер</button>'+
        '<button class="abtn" id="btn-docs-'+idx+'" onclick="openDocs('+i+')">📎 Документы</button>'+
      '</div>' +
    '</div>';
  }).join('');
}

// STATUS
async function chStatus(idx, s, btn) {
  const c = all[idx];
  btn.disabled = true;
  try {
    await fetch(URL, {method:'POST', body:JSON.stringify({action:'update_candidate_status', email:c.email, name:c.name, vacancy:c.vacancy, status:s})});
    all[idx].status = s;
    document.getElementById('sb-'+idx).className = 'sbadge s-'+s;
    document.getElementById('sb-'+idx).textContent = SL[s];
    const card = document.getElementById('card-'+idx);
    card.querySelectorAll('.sbtn').forEach(b=>{ b.classList.remove('active'); b.disabled=false; });
    btn.classList.add('active'); btn.disabled=true;
  } catch(e) { btn.disabled=false; }
}

async function setStatus(s) {
  if (!cur) return;
  await fetch(URL, {method:'POST', body:JSON.stringify({action:'update_candidate_status', email:cur.email, name:cur.name, vacancy:cur.vacancy, status:s})});
}

// OFFER MODAL
function openOffer(idx) {
  cur = {...all[idx], _idx: idx};
  document.getElementById('mOfferTitle').textContent = '📄 Оффер — ' + cur.name;
  document.getElementById('mOfferText').style.display = 'none';
  document.getElementById('mOfferActions').style.display = 'none';
  document.getElementById('mOfferLoading').style.display = 'none';
  document.getElementById('mOffer').classList.add('open');
}

async function genOffer() {
  document.getElementById('mOfferLoading').style.display = 'block';
  document.getElementById('mOfferText').style.display = 'none';
  document.getElementById('mOfferActions').style.display = 'none';
  const r = await fetch(URL, {method:'POST', body:JSON.stringify({action:'generate_offer', name:cur.name, vacancy:cur.vacancy, salary:document.getElementById('mOfferSalary').value, start:document.getElementById('mOfferStart').value, lang:document.getElementById('mOfferLang').value})});
  const d = await r.json();
  document.getElementById('mOfferLoading').style.display = 'none';
  document.getElementById('mOfferText').textContent = d.ok ? d.offer : 'Ошибка: ' + d.error;
  document.getElementById('mOfferText').style.display = 'block';
  if (d.ok) document.getElementById('mOfferActions').style.display = 'flex';
}

// DOCS MODAL
function openDocs(idx) {
  cur = {...all[idx], _idx: idx};
  document.getElementById('mDocsTitle').textContent = '📎 Документы — ' + cur.name;
  document.getElementById('mDocsStart').value = '';
  document.getElementById('mDocsPreview').style.display = 'none';
  document.getElementById('mDocsLoading').style.display = 'none';
  document.getElementById('mDocs').classList.add('open');
}

async function genDocs() {
  const start = document.getElementById('mDocsStart').value.trim();
  if (!start) { document.getElementById('mDocsStart').style.borderColor='var(--err)'; return; }
  document.getElementById('mDocsLoading').style.display = 'block';
  document.getElementById('mDocsPreview').style.display = 'none';
  const r = await fetch(URL, {method:'POST', body:JSON.stringify({action:'generate_docs_email', name:cur.name, vacancy:cur.vacancy, startDate:start, lang:document.getElementById('mDocsLang').value})});
  const d = await r.json();
  document.getElementById('mDocsLoading').style.display = 'none';
  if (d.ok) {
    document.getElementById('mDocsSubj').value = d.subject;
    document.getElementById('mDocsBody').value = d.body;
    document.getElementById('mDocsPreview').style.display = 'block';
  } else { alert('Ошибка: ' + d.error); }
}

function openMail() {
  const s = encodeURIComponent(document.getElementById('mDocsSubj').value);
  const b = encodeURIComponent(document.getElementById('mDocsBody').value);
  window.open('mailto:' + (cur.email||'') + '?subject=' + s + '&body=' + b, '_blank');
  // Подсвечиваем кнопку Документы
  if (cur._idx !== undefined) {
    markDone('btn-docs-' + cur._idx, 'primary');
  }
}

async function confirmOffer() {
  await setStatus('offer');
  closeModal('mOffer');
  // Подсвечиваем кнопку Оффер
  if (cur._idx !== undefined) {
    markDone('btn-offer-' + cur._idx, 'success');
  }
  reload();
}

function copyDocs() {
  navigator.clipboard.writeText(document.getElementById('mDocsSubj').value + '\n\n' + document.getElementById('mDocsBody').value);
}

// UTILS
function markDone(btnId, cls) {
  setTimeout(() => {
    const btn = document.getElementById(btnId);
    if (btn) btn.classList.add(cls || 'primary');
  }, 500);
}

function copyText(id) {
  navigator.clipboard.writeText(document.getElementById(id).textContent);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.addEventListener('click', e => {
  if (e.target.classList.contains('moverlay')) e.target.classList.remove('open');
});
</script>
</body>
</html>
